[project]
name = "Vivah-Sutra"
version = "1.0.0"
description = "Vivah Sutra Matrimony Django ASGI App"
authors = [
    { name = "Lakshay Jindal" }
]
dependencies = [
    "Django==5.2.1",
    "channels==4.2.2",
    "channels-redis==4.3.0",
    "daphne==4.2.1",
    "whitenoise==6.9.0",
    "dj-database-url==3.0.1",
    "psycopg2-binary==2.9.10",
    "redis>=6.2.0",
    "gunicorn==23.0.0",
    "pillow==11.2.1",
    "python-dotenv>=1.0.0",
    "supabase==2.17.0",
    "resend>=0.5.0",
    "faker>=18.0.0",
]

[tool.setuptools.packages.find]
include = ["main*", "user*", "connect*", "plans*", "search*", "siteadmin*"]
