name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.2
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure known_hosts (optional but recommended)
        run: |
          ssh-keyscan -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts

      - name: Run remote deploy script
        run: |
          # If you committed deploy.sh to the repo, you can copy via rsync:
          rsync -avz --delete ./ ${ { secrets.REMOTE_USER } }@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/Atut/
          # Then execute the server-side script over SSH:
          ssh -o StrictHostKeyChecking=no "${{ secrets.REMOTE_USER }}"@"${{ secrets.REMOTE_HOST }}" 'bash -lc "cd /home/${{ secrets.REMOTE_USER }}/Atut && ./deploy.sh"'
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
