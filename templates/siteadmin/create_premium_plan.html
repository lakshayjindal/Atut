{% extends "admin/base_site.html" %}
{% block content %}

<div style="max-width:600px;margin:0 auto;">
  <div style="margin-bottom:24px;">
    <h2 style="font-family:'Playfair Display',serif;color:#1A6B72;margin:0 0 4px;font-size:1.4rem;">Create Premium Plan</h2>
    <p style="color:#4A6370;font-size:.85rem;margin:0;">Define a new subscription plan with features and pricing.</p>
  </div>

  <div style="background:#fff;border:1px solid #E2E8EB;border-radius:14px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.06);">
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;flex-direction:column;gap:16px;">
        {{ form.as_p }}
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;align-items:center;">
        <button type="submit" style="
          background:#1A6B72;color:#fff;border:none;
          padding:11px 26px;border-radius:8px;
          font-size:.9rem;font-weight:600;cursor:pointer;
          transition:background .2s;
        " onmouseover="this.style.background='#124E54'" onmouseout="this.style.background='#1A6B72'">
          Create Plan
        </button>
        <a href="{% url 'admin:index' %}" style="font-size:.85rem;color:#4A6370;text-decoration:none;">
          ← Back to Admin
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
