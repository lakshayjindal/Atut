{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width:520px;margin:32px auto;">
  <div style="background:#fff;border:1px solid #E2E8EB;border-radius:14px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.07);">
    <h2 style="font-family:'Playfair Display',serif;color:#1A6B72;margin:0 0 6px;font-size:1.4rem;">Import Users via CSV</h2>
    <p style="color:#4A6370;font-size:.85rem;margin:0 0 24px;">Upload a CSV file to bulk-create users and profiles.</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div style="margin-bottom:18px;">{{ form.as_p }}</div>
      <button type="submit" style="
        background:#1A6B72;color:#fff;border:none;
        padding:11px 24px;border-radius:8px;
        font-size:.9rem;font-weight:600;cursor:pointer;
        transition:background .2s;
      " onmouseover="this.style.background='#124E54'" onmouseout="this.style.background='#1A6B72'">
        Upload &amp; Preview
      </button>
    </form>
  </div>
</div>
{% endblock %}
