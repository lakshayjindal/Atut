{% extends "admin/base_site.html" %}

{% block content %}
<div style="margin-bottom:20px;">
  <h2 style="font-family:'Playfair Display',serif;color:#1A6B72;margin:0 0 6px;font-size:1.4rem;">Preview CSV Data</h2>
  <p style="color:#4A6370;font-size:.85rem;margin:0;">Review the data below before importing.</p>
</div>

<form method="post">
  {% csrf_token %}

  <div style="overflow-x:auto;border:1px solid #E2E8EB;border-radius:10px;margin-bottom:20px;">
    <table style="border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;">
      <thead>
        <tr>
          {% for header in rows.0.keys %}
          <th style="
            position:sticky;top:0;
            background:#1A6B72;color:#fff;
            padding:10px 14px;text-align:left;
            font-weight:600;font-size:12px;
            text-transform:uppercase;letter-spacing:.4px;
            white-space:nowrap;
          ">{{ header }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr style="{% cycle 'background:#F7F9FA;' 'background:#fff;' %}">
          {% for value in row.values %}
          <td style="padding:9px 14px;border-bottom:1px solid #E2E8EB;white-space:nowrap;color:#1C2B30;">{{ value }}</td>
          {% endfor %}
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <input type="hidden" name="rows_json" value='{{ hidden_rows|escape }}'>

  <button type="submit" name="confirm_import" value="1" style="
    background:#1A6B72;color:#fff;border:none;
    padding:11px 24px;border-radius:8px;
    font-size:.9rem;font-weight:600;cursor:pointer;
    transition:background .2s;
  " onmouseover="this.style.background='#124E54'" onmouseout="this.style.background='#1A6B72'">
    Confirm &amp; Import
  </button>
</form>
{% endblock %}
