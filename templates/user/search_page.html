{% extends "./base.html" %}
{% load static %}
{% block title %}Search Profiles | Vivah Sutra®{% endblock %}

{% block extra_head %}
<style>
  .search-wrap { max-width: 1200px; margin: 0 auto; }

  /* ── Search box ── */
  .search-box {
    background: var(--surface);
    border-radius: 16px;
    padding: 22px 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .search-box-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem; color: var(--text-1);
    margin-bottom: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .search-box-title i { color: var(--rose); }

  #search-form {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  #search-form input,
  #search-form select {
    padding: 10px 13px;
    border: 1.5px solid var(--border-med);
    border-radius: 9px;
    font-size: .875rem;
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    transition: border-color .2s, box-shadow .2s;
    width: 100%;
  }
  #search-form input:focus,
  #search-form select:focus {
    outline: none;
    border-color: var(--rose);
    box-shadow: 0 0 0 3px rgba(192,65,90,.1);
    background: var(--surface);
  }
  #search-form input::placeholder { color: var(--text-3); }

  /* ── Results area ── */
  #results-area {
    min-height: 200px;
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--text-1); color: #fff;
    padding: 12px 18px; border-radius: 12px;
    font-size: .875rem; font-weight: 500;
    opacity: 0; pointer-events: none;
    transform: translateY(8px);
    transition: all .3s; z-index: 9999;
    box-shadow: var(--shadow-lg);
  }
  #toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #toast.error { background: var(--rose-dark); }
  #toast.success { background: var(--sage); }

  /* ── Muted hint ── */
  .search-hint {
    text-align: center; padding: 48px 20px;
    color: var(--text-3);
  }
  .search-hint i { font-size: 2.2rem; margin-bottom: 12px; color: var(--border-med); }
  .search-hint p { font-size: .9rem; }

  @media (max-width: 480px) {
    #search-form { grid-template-columns: 1fr 1fr; }
  }
</style>
{% endblock %}

{% block content %}
<div class="search-wrap">
  <div id="toast"></div>

  <!-- Search Form -->
  <div class="search-box">
    <div class="search-box-title"><i class="fas fa-search"></i> Find Your Match</div>
    <form id="search-form"
      hx-get="{% url 'search_results' %}"
      hx-target="#results-area"
      hx-trigger="change delay:250ms, keyup delay:300ms from:input">

      <input type="text" name="q" placeholder="Name">
      <input type="text" name="city" placeholder="City">
      <input type="text" name="profession" placeholder="Profession">

      <select name="gender">
        <option value="">Any Gender</option>
        <option value="Male" {% if user.profile.gender == 'Female' %}selected{% endif %}>Male</option>
        <option value="Female" {% if user.profile.gender == 'Male' %}selected{% endif %}>Female</option>
        <option value="Other">Other</option>
      </select>

      <input type="number" name="age_min" placeholder="Min Age" min="18" max="80">
      <input type="number" name="age_max" placeholder="Max Age" min="18" max="80">
    </form>
  </div>

  <!-- Results -->
  <div id="results-area"
    hx-get="{% url 'search_results' %}?initial=1"
    hx-trigger="load"
    hx-target="#results-area">
    <div class="search-hint">
      <i class="fas fa-heart"></i>
      <p>Start typing to discover profiles…</p>
    </div>
  </div>

  <div style="height:40px;"></div>
</div>
{% endblock %}
